name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2.31.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc

      - shell: bash
        run: mkdir -p build

      - name: Build
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cc -std=c11 -O2 -Wall -o build/worcle worcle.c

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          gcc -std=c11 -O2 -Wall -o build/worcle.exe worcle.c

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: worcle-${{ matrix.os }}
          path: build/